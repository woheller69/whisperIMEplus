name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      ENCRYPTED_KEY: signing/sussurro.p12.enc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Prepare signing key
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_PASSWORD is not set: this build uses a temporary key and will not update over the previous one."
            exit 0
          fi
          if [ "${#SIGNING_PASSWORD}" -lt 20 ]; then
            echo "::error::SIGNING_PASSWORD must have at least 20 characters."
            exit 1
          fi
          KEY="$RUNNER_TEMP/sussurro.p12"
          if [ -f "$ENCRYPTED_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSWORD -in "$ENCRYPTED_KEY" -out "$KEY"
          else
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -alias sussurro \
              -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Sussurro" \
              -storepass:env SIGNING_PASSWORD
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSWORD -in "$KEY" -out "$ENCRYPTED_KEY"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENCRYPTED_KEY"
            git commit -m "Add encrypted signing key [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "SIGNING_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build
        run: |
          rm -f local.properties
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: sussurroIME-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
